name: Number theory lab verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and extract the original project ZIP
        run: |
          echo "0a64dd290eaae88fe5a82115867e5dcec69d650b9bc6a08438388497e75fa922  inputs/alpoge-lab.zip" | sha256sum -c
          unzip -q inputs/alpoge-lab.zip -d "$RUNNER_TEMP/original"
          cd "$RUNNER_TEMP/original/alpoge-lab"
          python3 -B -m unittest -v
          python3 -B zeta_prime_density.py cm certified cm_prime_1024.json
      - name: Generate the rank-changing embedding data and check in Lean
        run: |
          mkdir -p evidence
          set -o pipefail
          bash cloud-setup.sh core 2>&1 | tee evidence/core.log
          cp .alpoge-build/norm-five.json .alpoge-build/cm-verified.json evidence/
      - name: Verify cubic-field research and Goldilocks order witnesses
        run: |
          set -euo pipefail
          mkdir -p crypto-evidence
          python3 -B cubic_crypto_lab.py survey --through 10000 > crypto-evidence/field-survey.json
          python3 -B goldilocks_order.py | tee crypto-evidence/prime-and-order.log
          python3 -B cubic_crypto_lab.py walk --start 340282366762482138508632908526633615361 --count 5 > crypto-evidence/walk-wrap.jsonl
          export PATH="$PWD/.alpoge-build/lean-4.33.1-linux/bin:$PATH"
          timeout 180 lean lean/GoldilocksOrder.lean 2>&1 | tee crypto-evidence/lean-order.log
          timeout 180 lean lean/Curve25519Period.lean 2>&1 | tee crypto-evidence/lean-curve.log
          timeout 180 lean lean/TraceAction.lean 2>&1 | tee crypto-evidence/lean-action.log
          timeout 180 lean lean/PrefixArithmetic.lean 2>&1 | tee crypto-evidence/lean-prefix.log
          timeout 180 lean lean/TransformPrime.lean 2>&1 | tee crypto-evidence/lean-transform.log
          if grep -q 'sorryAx' crypto-evidence/lean-*.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cubic-crypto-evidence
          path: crypto-evidence/
          if-no-files-found: error
      - name: Build the pinned archive lemma and its specialization
        run: |
          set -euo pipefail
          export PATH="$PWD/.alpoge-build/lean-4.33.1-linux/bin:$PATH"
          export MATHLIB_CACHE_DIR="$RUNNER_TEMP/mathlib-cache"
          cd lean-bridge
          python3 -B fetch_archive.py
          python3 -B shallow_deps.py
          lake exe cache get Mathlib
          lake build Formalism.ThetaLiftIndependence.ThetaOrbitSums.OrbitSum
          sh check-instance.sh 2>&1 | tee ../evidence/bridge.log
          if grep -q 'sorryAx' ../evidence/bridge.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaussian-verification
          path: evidence/
          if-no-files-found: ignore

  independent-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PARI and the transitive Galois group tables
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends pari-gp pari-galdata
      - name: Recompute field orders and factorization patterns through one million
        run: |
          set -euo pipefail
          mkdir -p deep-evidence
          gp --version > deep-evidence/pari-version.txt 2>&1
          gp -q -f research/pari_audit.gp > "$RUNNER_TEMP/pari-rows.jsonl"
          gzip -n -c "$RUNNER_TEMP/pari-rows.jsonl" > deep-evidence/pari-rows.jsonl.gz
          python3 -B galois_census.py deep-evidence/pari-rows.jsonl.gz > deep-evidence/census.json
          python3 -B matrix_periods.py > deep-evidence/exact-periods.json
          python3 -B rh_trace_window.py > deep-evidence/one-root-window.txt
          python3 -B rh_prefix.py > deep-evidence/prefix-count.txt
          python3 -B ntt_fixture.py > deep-evidence/transform-prime.json
          gp -q -f research/pari_transform.gp > deep-evidence/transform-pari.json
          python3 -B - <<'PYTHON'
          import json
          from pathlib import Path
          from ntt_fixture import OMEGA, P
          p, omega, order, roots, perrin_roots, larger_primes = json.loads(Path("deep-evidence/transform-pari.json").read_text())
          if (p, omega, order, len(roots), perrin_roots, larger_primes) != (P, OMEGA, 2**128, 1, [], 0):
              raise ValueError("PARI disagrees with the Python transform certificate")
          u = roots[0]
          if (u**9-18*u**6+54*u**3+27) % P:
              raise ValueError("trace root fails its defining equation")
          PYTHON
          python3 -B - <<'PYTHON'
          import json
          from pathlib import Path
          from cubic_lift import cubic_lift
          from cubic_trace_criterion import root_count, F
          records = json.loads(Path("research/public_fields.json").read_text())
          lifts = {r["id"]: cubic_lift(p) for r in records for p in [int(r["modulus"])]
                   if p % 3 == 1 and root_count(F,p) == 0}
          Path("deep-evidence/explicit-lifts.json").write_text(json.dumps(lifts, indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: deep-cubic-audit
          path: deep-evidence/
          if-no-files-found: error
