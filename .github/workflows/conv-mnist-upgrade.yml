name: Verify ConvMNIST upgrade evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/conv-mnist-upgrade/**'
      - '.github/workflows/conv-mnist-upgrade.yml'
  pull_request:
    paths:
      - 'research/conv-mnist-upgrade/**'
      - '.github/workflows/conv-mnist-upgrade.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the offline replay and published two-Mac comparisons
        run: python3 research/conv-mnist-upgrade/verify.py
