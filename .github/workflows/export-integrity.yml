name: Verify published GRH export integrity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record available runner resources
        run: |
          mkdir -p provenance
          { free -h; df -h .; nproc; } | tee provenance/runner.txt
      - name: Verify challenge declarations and published comparison log
        run: |
          set -euo pipefail
          base='https://math.mit.edu/~drew/grh'
          curl --fail --silent --show-error --location --retry 3 "$base/challenge.ndjson.zst" -o "$RUNNER_TEMP/challenge.ndjson.zst"
          curl --fail --silent --show-error --location --retry 3 "$base/con-leche-compare.log" -o "$RUNNER_TEMP/con-leche-compare.log"
          python3 projects/number-theory/research/audit_export.py challenge "$RUNNER_TEMP/challenge.ndjson.zst" "$RUNNER_TEMP/con-leche-compare.log" | tee provenance/challenge.json
      - name: Verify compressed and raw solution in a single streaming pass
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://math.mit.edu/~drew/grh/solution.ndjson.zst' | python3 projects/number-theory/research/stream_solution.py | tee provenance/solution.json
      - uses: actions/upload-artifact@v4
        with:
          name: proof-export-integrity
          path: provenance/
          if-no-files-found: error
