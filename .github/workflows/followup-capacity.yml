name: Followup native Linux build
on:
  push:
    branches: [resnet-followup-capacity-20261122]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile five stage arms and packing oracle
        env:
          CC: gcc-12
          CXX: g++-12
        run: bash stage-replication/build.sh "$RUNNER_TEMP/native-stage"
