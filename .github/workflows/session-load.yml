name: BFV matched key loading and filter banks
on:
  push:
    branches: [filter-bank-load-20261122-private-v1]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record runner environment
        run: |
          set -euo pipefail
          mkdir x86
          {
            uname -smr
            sed -n 's/^PRETTY_NAME=//p' /etc/os-release
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Thread\(s\) per core|Hypervisor vendor):'
            c++ --version | head -1
            cmake --version | head -1
            python3 --version
          } > x86/host.txt
      - name: Build pinned SEAL
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/seal"
          git -C "$RUNNER_TEMP/seal" fetch --quiet --depth=1 https://github.com/microsoft/SEAL.git ce53aa40969364f79599009bc8882f71fce0c13d
          git -C "$RUNNER_TEMP/seal" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/seal" rev-parse HEAD)" = ce53aa40969364f79599009bc8882f71fce0c13d
          cmake -S "$RUNNER_TEMP/seal" -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release -DSEAL_BUILD_DEPS=OFF -DSEAL_USE_MSGSL=OFF -DSEAL_USE_INTEL_HEXL=OFF -DSEAL_USE_ZLIB=OFF -DSEAL_USE_ZSTD=OFF -DSEAL_BUILD_TESTS=OFF -DSEAL_BUILD_EXAMPLES=OFF -DSEAL_BUILD_BENCH=OFF
          cmake --build "$RUNNER_TEMP/build" --parallel 2
      - name: Measure fresh key loading
        run: |
          set -euo pipefail
          SEAL_SOURCE_DIR="$RUNNER_TEMP/seal" SEAL_BUILD_DIR="$RUNNER_TEMP/build" sh decision-load/replay.sh
          cp decision-load/results.csv x86/load.csv
      - name: Measure filter evaluation and wire bytes on the same host
        run: |
          set -euo pipefail
          sh decision-filters/replay.sh "$RUNNER_TEMP/seal" "$RUNNER_TEMP/build" x86/raw > x86/summary.csv
          SEAL_SOURCE_DIR="$RUNNER_TEMP/seal" SEAL_BUILD_DIR="$RUNNER_TEMP/build" sh decision-wire/replay.sh "$RUNNER_TEMP/wire-blobs"
          cp decision-wire/results.csv x86/wire.csv
          (cd x86 && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SUMS && mv ../SUMS SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: session-load-data
          path: x86/
          if-no-files-found: error
