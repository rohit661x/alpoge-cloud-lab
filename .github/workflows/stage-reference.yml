name: Replay published ResNet20 stage references
on:
  push:
    branches: [resnet20-native-stage-20261122-private-v1]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently fetch the published application and weights
        working-directory: native-stage
        run: |
          set -euo pipefail
          git init -q app
          git -C app fetch --quiet --depth=1 https://github.com/lorenzorovida/LowMemoryFHEResNet20.git c818bd3519794191dfcf78c252bc209ee30e3e4a
          git -C app checkout --quiet --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = c818bd3519794191dfcf78c252bc209ee30e3e4a
          python3 provenance.py app computed.csv
          cmp computed.csv weight-manifest.csv
      - name: Recompute three native plaintext references and compare every checkpoint
        working-directory: native-stage
        run: |
          set -euo pipefail
          mkdir -p work
          c++ -O2 -std=c++17 reference.cpp -o work/reference
          for degree in 59 200 119; do work/reference app/weights published-input.f64 "$degree" "work/ref$degree"; done
          python3 verify_refs.py | tee references.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resnet20-cross-platform-check
          path: native-stage/references.txt
          if-no-files-found: error
