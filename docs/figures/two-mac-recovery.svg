			<path d="M 336.612246,72 L 336.612246,84 Z" style="stroke: rgb(0%,43%,39%); stroke-linecap: butt; stroke-width: 2;"/>
			<circle cx="227.4892888" cy="78" r="5" style="stroke: rgb(0%,43%,39%); stroke-linecap: butt; stroke-width: 1; fill: rgb(0%,43%,39%); fill-rule: evenodd;"/>
			<text x="453" y="73" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(8%,18%,22%); stroke:none;" transform="translate(0,146) scale(1,-1)">-9 ms</text>
			<text x="15" y="11" style="font-family: Helvetica; font-size: 14px;fill: rgb(26%,36%,40%); stroke:none;" transform="translate(0,22) scale(1,-1)">Positive = slower. Paired means and 95% intervals over 12 key sets.</text>
